<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wirely</title>
</head>
<body>
  <header>
    <span class="title">⚡ Wirely</span>
    <input id="docName" type="text" placeholder="Nom du projet" aria-label="Nom du projet">
    <span class="sep"></span>
    <button id="undo" title="Annuler (Ctrl+Z)">↶ Annuler</button>
    <button id="redo" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
    <span class="spacer"></span>
    <button id="newDoc">Nouveau</button>
    <button id="openDoc">Ouvrir…</button>
    <button id="saveDoc">Enregistrer (.json)</button>
    <div class="menu" id="exportMenu">
      <button class="primary" id="exportBtn">Exporter ▾</button>
      <div class="drop">
        <button data-exp="png">Image PNG</button>
        <button data-exp="svg">Image SVG</button>
        <button data-exp="pdf">PDF / Imprimer</button>
      </div>
    </div>
    <input id="fileIn" type="file" accept=".json,application/json" hidden>
  </header>

  <main>
    <aside class="left">
      <h3>Outils</h3>
      <div class="tools" id="tools"></div>
      <h3>Type de câble</h3>
      <div class="wires" id="wireTypes"></div>
      <div id="palette"></div>
    </aside>

    <div id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridS" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e8ecf2" stroke-width="1"/></pattern>
          <pattern id="gridL" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#d3d9e3" stroke-width="1"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#gridS)"/>
        <rect width="100%" height="100%" fill="url(#gridL)"/>
        <g id="world"></g>
      </svg>
      <div id="empty"><div><b>Commencez votre plan</b><br>
        1. Dessinez une <b>pièce</b> ou des <b>murs</b><br>
        2. Placez des <b>symboles</b> (prises, interrupteurs, lampes…)<br>
        3. Reliez-les avec des <b>câbles</b><br>
        4. <b>Exportez</b> en PNG, SVG ou PDF</div></div>
      <div id="hint"></div>
      <div id="zoomBox">
        <button id="zOut" title="Dézoomer">−</button>
        <button id="zFit" title="Ajuster à la fenêtre">Ajuster</button>
        <button id="zIn" title="Zoomer">+</button>
      </div>
    </div>

    <aside class="right"><div id="props"></div></aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
